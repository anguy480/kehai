[project]
name = "vc-multimodal"
version = "0.1.0"
description = "Prosodic, turn-taking, and facial feature extraction from clinical Zoom sessions, with a label-free handoff to analysis."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Aidan Nguyen" }]
# License intentionally omitted: awaiting lab approval (see README).
classifiers = ["Private :: Do Not Upload"]

dependencies = [
  # CLI / config / logging
  "typer>=0.15",
  "rich>=13.0",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  # tables and contracts
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "pandera>=0.20",
  "joblib>=1.4",
  # audio / speech
  "praat-parselmouth>=0.4.4",
  "silero-vad>=5.1",
  "torch>=2.2",
  "torchaudio>=2.2",
  # video / face
  # cv2 comes from mediapipe, which requires opencv-contrib-python. Do not add
  # opencv-python or -headless as well: they install into the same `cv2`
  # namespace and whichever lands last silently wins.
  "mediapipe>=0.10.14",
  # modeling
  "scikit-learn>=1.5",
  "scipy>=1.13",
]

[project.optional-dependencies]
# Local diarization. Kept optional so neither CI nor the professor's machine
# needs a Hugging Face token or a model download.
pyannote = ["pyannote-audio>=3.1"]
# On-device OCR of Zoom name labels, used by `vc verify-layout` to determine
# which tile holds the psychiatrist. macOS only; no recognised text is ever
# printed, logged or written. See docs/decisions/0009.
ocr = ["pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'"]

[project.scripts]
vc = "vc_multimodal.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "pre-commit>=3.8",
  "detect-secrets>=1.5",
  "types-pyyaml>=6.0",
  "pandas-stubs>=2.2",
]

[tool.uv]
# The development machine has a conda base environment with its own
# Python 3.11. Forcing a uv-managed interpreter keeps this project
# reproducible whether or not conda happens to be active.
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vc_multimodal"]

# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "SIM",       # simplify
  "PTH",       # use pathlib
  "RET",       # return style
  "ARG",       # unused arguments
  "PL",        # pylint subset
  "RUF",
  "D",         # pydocstyle: docstrings on public functions
  "ANN",       # type annotations
  "T20",       # no print outside the CLI (see per-file ignores)
]
ignore = [
  "D203",      # conflicts with D211
  "D213",      # conflicts with D212
  "ANN401",    # allow typing.Any where genuinely needed
  "PLR0913",   # stage functions legitimately take several config args
  "PLR0917",   # a CLI callback is a flat list of options by design
]

[tool.ruff.lint.per-file-ignores]
# The CLI is the only place allowed to write to stdout.
"src/vc_multimodal/cli.py" = ["T20"]
# Tests need neither docstrings nor full annotations to be useful.
# Tests deliberately contain fullwidth Japanese punctuation and letters, which
# is exactly what the label-normalisation tests exist to cover.
"tests/**" = ["D", "ANN", "T20", "PLR2004", "ARG", "RUF001"]
"scripts/**" = ["T20", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = [
  "parselmouth.*", "silero_vad.*", "cv2.*", "mediapipe.*",
  "pyannote.*", "joblib.*", "pandera.*", "sklearn.*", "scipy.*",
  "Quartz.*", "Vision.*", "Foundation.*", "objc.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: exercises real decoding or model inference",
  "integration: end-to-end run over synthetic data",
]
filterwarnings = ["error::DeprecationWarning:vc_multimodal.*"]

[tool.coverage.run]
source = ["vc_multimodal"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]
