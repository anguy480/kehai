# ---------------------------------------------------------------------------
# vc-multimodal default configuration
#
# Every setting is validated against the pydantic models in
# src/vc_multimodal/config.py. Unknown keys are an error, not a warning.
#
# Items marked UNCONFIRMED are project unknowns. They are surfaced here on
# purpose: nothing about the recordings is guessed in code. Confirm each one,
# then edit it here.
#
# Filesystem roots are NOT configured here. They come from the environment
# ($VC_DATA_ROOT, $VC_WORK_ROOT, $VC_OUT_ROOT) or a gitignored .env, so that no
# path to clinical data is ever committed.
# ---------------------------------------------------------------------------

dataset:
  expected_sessions: 62
  media_glob: "*.mp4"

  # The five recording-date folders, grouped into recruitment waves. Folder
  # names contain spaces and are matched exactly. Session-ID ranges are used to
  # cross-check that each file sits in the wave its ID implies.
  waves:
    winter:
      folders:
        - "December 21 2025"
        - "January 17 2026"
        - "January 31 2026"
      id_min: 1
      id_max: 62
    summer:
      folders:
        - "July 4 2026"
        - "August 1 2026"
      id_min: 102
      id_max: 261

  # Sessions are nominally 10-12 minutes, but the real spread is 3.9 to 16.2
  # minutes (median 11.6). A recording is flagged if it falls outside the
  # absolute window OR more than mad_k median-absolute-deviations from the
  # cohort median. Flagging never drops a session; it only reports.
  #
  # The window is deliberately wide so that a flag means "genuinely odd"
  # rather than "not 10 to 12 minutes": at 8-15 min it flagged 10 of 62
  # sessions, mostly ordinary variation. The robust test carries the load
  # instead, at a tighter mad_k.
  duration:
    min_seconds: 300.0    # 5 min
    max_seconds: 1000.0   # 16.7 min
    mad_k: 2.5

  # Already known to be unusually short. Listed so the inventory can report it
  # as expected rather than as a surprise.
  known_short_sessions: [210]

video:
  # UNCONFIRMED. Zoom two-person gallery view is expected: psychiatrist left,
  # participant right. It may instead be active-speaker view, in which a single
  # tile switches between people and per-tile cropping is invalid.
  # Confirm with `vc preview`, then set this to "gallery" or "active_speaker".
  layout: "gallery"

  # Zoom recordings can carry black bars. When they do, the participant tiles
  # occupy the content area, not the whole 1280x720 frame, so splitting the
  # frame down the middle splits the picture off-centre and every crop is
  # wrong. "auto" detects the bars per frame and interprets the tile fractions
  # below within the content area. "off" treats them as fractions of the whole
  # frame. `vc verify-layout --debug-region` reports what was detected.
  letterbox_detection: "auto"

  # Crop boxes in fractional frame coordinates (origin top-left), so one config
  # works at any resolution. Defaults split the frame down the middle.
  # UNCONFIRMED: adjust after looking at the preview images.
  tiles:
    left:
      x: 0.0
      y: 0.0
      width: 0.5
      height: 1.0
    right:
      x: 0.5
      y: 0.0
      width: 0.5
      height: 1.0

  # UNCONFIRMED: which tile holds whom.
  participant_tile: "right"
  psychiatrist_tile: "left"

  # `vc preview` writes ONE image per session: a grid of every tile at each of
  # these timestamps. Several timestamps are used so that a layout which
  # switches mid-session (active-speaker view) is visible at a glance.
  preview_times_seconds: [60.0, 300.0, 540.0]
  preview_max_width: 1280
  preview_format: "jpg"

audio:
  sample_rate: 16000      # Silero VAD and speaker embeddings both expect 16 kHz
  codec: "pcm_s16le"      # uncompressed mono WAV
  # CONFIRMED by `vc inventory` over all 62 recordings: a single mixed AAC
  # stream, stereo, 48 kHz. "auto" still checks per file and flags anything
  # that disagrees, rather than trusting this note.
  stream_layout: "auto"

  # A corrupt or partially copied recording keeps its original metadata, so its
  # stated duration looks normal and ffprobe cannot tell: session 212 claims
  # 404 s in 3.4 MB and decodes to 46 s. ffmpeg exits 0 on it. The decoded
  # audio is therefore compared against the stated duration, and a shortfall
  # beyond this many seconds is flagged as truncated.
  max_duration_shortfall_s: 1.0

  stereo_probe:
    # The one stream is stereo, and Zoom sometimes pans speakers across the
    # stereo field. If the channels genuinely differ, that partial separation
    # is a cheap signal about who is speaking that owes nothing to
    # diarization, so the channels are compared rather than assumed identical.
    # Measured while the audio is being decoded anyway, so it costs almost
    # nothing. See docs/decisions/0010.
    enabled: true
    # Frames quieter than this count as silence and are left out of the
    # correlation: silence correlates arbitrarily and would swamp the result.
    activity_floor: 0.002
    # At or above this correlation, treat the channels as the same signal.
    # Lossy AAC means a mono source will not be bit-identical, so the
    # correlation, not exact equality, is the measure to trust.
    correlated_above: 0.98
    # Below this, separation is strong enough to be worth exploiting.
    strong_separation_below: 0.50
    imbalance_db: 3.0       # flag a channel this much louder than the other
    chunk_seconds: 10.0     # decode window; bounds memory, not the result

diarization:
  # "import"              read existing whisper-diarization output (default:
  #                       reuses the manuscript's transcripts, so the
  #                       comparison against its text features is direct)
  # "pyannote"            diarize locally; needs the `pyannote` extra + token
  # "whisper_diarization" run the upstream tool as an external subprocess and
  #                       read its output with the importer
  backend: "import"

  # Directory holding the files to import, relative to $VC_WORK_ROOT.
  # CONFIRMED: the original whisper-diarization output, supplied by the lab,
  # unzipped to this path. 62 .srt files named by session ID, matching the
  # inventory exactly, alongside 62 .txt files that carry no timestamps and are
  # reported as ignored rather than used.
  import_dir: "diarization/diarizations_original"

  # Filename patterns tried in order when matching a session ID to its files.
  # `{session_id}` is substituted.
  import_patterns:
    - "{session_id}.srt"
    - "{session_id}.txt"
    - "{session_id}_speaker.txt"
    - "{session_id}/{session_id}.srt"

  # Transcript text is retained for diagnostics but written ONLY under
  # $VC_WORK_ROOT, never printed and never included in a handoff bundle.
  keep_text: true

  # Both are QC expectations, not corrections. A session that disagrees is
  # flagged and left alone.
  expected_speakers: 2
  min_coverage_fraction: 0.30

  pyannote:
    model: "pyannote/speaker-diarization-3.1"
    revision: null          # pin once chosen; recorded in the manifest
    num_speakers: 2
    token_env: "HF_TOKEN"

  whisper_diarization:
    # Invoked as a subprocess in its own environment. Not a Python dependency
    # of this project: upstream requirements do not install cleanly on Apple
    # silicon. See scripts/whisper_diarization_setup.md.
    command: ["python", "diarize.py"]
    language: "ja"
    output_dir: null
    timeout_seconds: 3600.0

speakers:
  # Primary method: speaker-embedding similarity against a reference clip.
  #
  # ECAPA-TDNN via SpeechBrain, needing the optional `speaker` extra
  # (`uv sync --extra speaker`) and no access token. Validated on this cohort
  # with controls in both directions before being adopted: two halves of one
  # reference clip score 0.72-0.79 against each other, while a psychiatrist and
  # a participant from the same session score 0.18-0.68. Those ranges overlap at
  # the top, which is exactly why only the RANKING is used and never an absolute
  # threshold - see docs/decisions/0008.
  embedding:
    backend: "ecapa"
    source: "speechbrain/spkrec-ecapa-voxceleb"
    # Pinned: a different revision gives different similarities from the same
    # audio. This is the revision the validation above was run against.
    revision: "0f99f2d0ebe89ac095bcc5903c4dd8f72b367286"  # pragma: allowlist secret
    cache_dir: "models/ecapa"
    hf_home: "models/hf"

    # Short diarized segments are the ones most likely to carry the other
    # person's voice, since the diarizer partitions time and cannot represent
    # overlap. Leaving them out sharpens the sample.
    min_segment_s: 1.0
    max_seconds_per_speaker: 120.0
    # Below this much usable speech a speaker gets no role rather than a role
    # guessed from almost nothing.
    min_speech_s: 5.0

  # Which side of the frame the psychiatrist is expected to be on. Set from
  # sessions checked by hand, so treat it as a DEFAULT, not a guarantee.
  # It is used only when label OCR is unavailable or inconclusive. When OCR
  # does reach a conclusion, that conclusion wins and any disagreement with
  # this value is recorded as a QC flag rather than silently overridden.
  # Run `vc verify-layout` to check it across all sessions.
  assumed_psychiatrist_side: "left"

  label_ocr:
    # Reads the Zoom name label in each tile to decide which side the
    # psychiatrist is on. Recognised text is compared in memory only: it is
    # never printed, logged or written to any file, because the labels are
    # people's names.
    enabled: true

    # "apple_vision" runs on-device on macOS via the Vision framework and needs
    # the optional `ocr` extra (`uv sync --extra ocr`). "tesseract" uses an
    # external binary if one is installed. "none" disables OCR, which makes
    # every session inconclusive and falls back to assumed_psychiatrist_side.
    backend: "apple_vision"
    languages: ["ja-JP", "en-US"]

    # Where the name label sits WITHIN a tile, in coordinates relative to that
    # tile. Zoom draws it in the bottom-left corner. UNCONFIRMED: check against
    # the `vc preview` sheets and widen if labels are being missed. Null
    # searches the whole tile, which is slower and noisier.
    label_region:
      x: 0.0
      y: 0.82
      width: 0.6
      height: 0.18

    sample_times_seconds: [60.0, 300.0, 540.0]

    # Name labels are small: in a 1280x720 frame a tile is 640 wide and the
    # label text only a dozen or so pixels tall, which is near the limit of
    # what on-device OCR reads reliably. The label patch is enlarged by this
    # factor before recognition.
    upscale: 3.0

    min_confidence: 0.30

    # The psychiatrist is identified without ever being named: their label is
    # the one that recurs across sessions, while each participant's appears
    # once. A label must show up in at least this fraction of sessions to count
    # as the recurring one.
    #
    # Set from the data, not guessed. Two recurring labels appear across the 62
    # sessions, each covering roughly half the cohort - consistent with two
    # psychiatrists, one per recruitment wave (see docs/decisions/0008). Any
    # threshold above about 0.42 therefore recognises neither of them: at 0.50
    # only 49 of 62 sessions could be settled, all of the rest being summer
    # wave. At 0.10 (six sessions) 59 of 62 settle. A participant's label
    # appears exactly once, so 0.10 still separates the two cleanly.
    min_recurrence: 0.10

    # Optional explicit label patterns, comma-separated, read from THIS
    # environment variable (set it in .env). Only the variable name lives here:
    # a real person's name must never be committed to this repository.
    psychiatrist_label_env: "VC_PSYCHIATRIST_LABELS"

  # One clip per psychiatrist, relative to $VC_WORK_ROOT/reference/.
  # Two clips, cut by hand from sessions carrying each of the two recurring
  # Zoom labels that OCR found. Whether they are two people or one person who
  # renamed themselves is reported by `vc assign-speakers`, which compares the
  # clips against each other directly.
  reference_clips:
    - psychiatrist_id: "psy_a"
      path: "psy_a.wav"
    - psychiatrist_id: "psy_b"
      path: "psy_b.wav"

  # CSV (session_id,reference_clip) naming the clip expected for each session,
  # relative to $VC_WORK_ROOT. Every session is scored against EVERY clip
  # regardless: comparing to all of them costs nothing once the session's own
  # speakers are embedded, and cross-clip agreement is a free robustness check.
  # This map says which clip is DECISIVE where they disagree, and a session
  # absent from it is decided by the best match across all clips.
  session_psychiatrist_map: "session_psychiatrist_map.csv"

  # Flag the session if the best-to-second-best similarity gap is below this.
  # Observed margins on the sessions checked by hand run 0.20 to 0.62, so 0.10
  # flags a genuinely ambiguous session rather than a merely unremarkable one.
  min_margin: 0.10

  mouth_crosscheck:
    # Independent check: correlate each diarized speaker's speech timeline
    # against jaw-open movement in EVERY configured tile, not just the
    # participant's. In gallery view both faces are visible, so a correct
    # assignment shows each speaker correlating with exactly one tile. This is
    # a cross-check only; the embedding method decides, and agreement between
    # the two is recorded as a QC column.
    enabled: true
    tiles: null             # null means every tile in video.tiles
    # Must divide the native 25 fps exactly. 5.0 fps is every 5th frame.
    #
    # The correlation being measured is between a mouth moving and a speech
    # timeline made of turns lasting seconds, not between a mouth and
    # individual syllables, so temporal resolution past a few frames a second
    # buys nothing and costs a landmarker call per frame per tile.
    sample_fps: 5.0
    min_correlation: 0.15   # below this, the visual evidence is too weak to use
    min_separation: 0.10    # required gap between best and second-best tile

vad:
  # Silero VAD refines the diarized segments, whose boundaries follow
  # transcription units and are known to span long silences, so they cannot be
  # trusted for timing features. See docs/decisions/0004.
  #
  # "intersect" runs the detector once over the whole recording and intersects
  # what it finds with each diarized segment. Silero is recurrent, so its
  # accuracy depends on surrounding context: one continuous pass is more
  # reliable at boundaries, and far faster, than hundreds of short ones.
  # "per_segment" detects inside each segment separately, which is the literal
  # reading, and is kept for comparison.
  mode: "intersect"
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 100
  speech_pad_ms: 30

turns:
  merge_same_speaker_gap_s: 0.30   # bridge micro-gaps within one speaker's turn
  min_pause_s: 0.18                # shorter silences are not counted as pauses
  max_latency_s: 10.0              # longer gaps are not treated as a response
  min_overlap_s: 0.05              # ignore overlaps at annotation resolution

prosody:
  # Participant speech only, with overlapping speech excluded.
  f0_floor_hz: 60.0
  f0_ceiling_hz: 500.0
  # F0 is expressed in semitones relative to the speaker's OWN median, so that
  # sex differences in absolute pitch do not dominate. See docs/decisions/0005.
  semitone_reference: "speaker_median"
  exclude_overlap: true
  min_analysis_s: 0.30             # skip fragments too short to measure
  opensmile:
    # Extension point for eGeMAPS. Off until a binary is available.
    enabled: false
    feature_set: "eGeMAPSv02"
    executable: null

face:
  backend: "mediapipe"             # or "openface" to import OpenFace 2.0 CSVs
  # Every recording runs at a constant 25 fps, so 5.0 means every 5th frame:
  # exactly even spacing, which matters more than temporal resolution for
  # session-level summary statistics, and half the work of 10 fps.
  #
  # The rate MUST divide the native frame rate exactly. A rate that does not
  # (10 fps at 25 fps native, which alternates 2- and 3-frame steps) is
  # rejected rather than silently rounded, because uneven spacing quietly
  # distorts anything derived from differences between frames. At 25 fps the
  # exact options are 25, 12.5, 5, 2.5 and 1.
  sample_fps: 5.0
  min_confidence: 0.50             # drop lower-confidence frames
  max_dropped_fraction: 0.40       # above this, flag the session in QC

  # The action units are the lab's house set, not a set chosen here: AU01,
  # AU02, AU04, AU06 and AU12, extracted with OpenFace in Tanaka et al. 2025
  # (JMIR Form Res 9:e59261). Miyamoto et al. 2025 (Acta Psychologica 254:
  # 104782) found expressivity in AU01, AU06 and AU12 positively associated
  # with social performance, which is why those three are the confirmatory
  # features in model.tiers. See docs/decisions/0013.
  #
  # Features are named by AU (face_speaking__au12_mean). MediaPipe blendshape
  # scores are NOT AU intensities: same construct, different scale, so values
  # from the two backends must never be pooled. The backend is recorded per
  # session and in the manifest.
  action_units:
    - key: "au01"
      description: "inner brow raiser"
      blendshapes: ["browInnerUp"]
      openface_column: "AU01_r"
    - key: "au02"
      description: "outer brow raiser"
      blendshapes: ["browOuterUpLeft", "browOuterUpRight"]
      openface_column: "AU02_r"
    - key: "au04"
      description: "brow lowerer"
      blendshapes: ["browDownLeft", "browDownRight"]
      openface_column: "AU04_r"
    - key: "au06"
      description: "cheek raiser"
      blendshapes: ["cheekSquintLeft", "cheekSquintRight"]
      openface_column: "AU06_r"
    - key: "au12"
      description: "lip corner puller"
      blendshapes: ["mouthSmileLeft", "mouthSmileRight"]
      openface_column: "AU12_r"

  # Not an expression feature: the mouth-movement cross-check in
  # docs/decisions/0008 correlates this against each speaker's timeline.
  jaw_blendshape: "jawOpen"
  # Tracking quality, not an expression feature.
  blink_blendshapes: ["eyeBlinkLeft", "eyeBlinkRight"]

  mediapipe:
    # Model asset is downloaded once into $VC_WORK_ROOT/models and its version
    # is recorded in the manifest. No frames are ever written or displayed.
    model_asset: "face_landmarker.task"
    model_url: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
    # Pinned: verified to emit all 52 blendshapes, including every one the
    # configured action units need.
    # pragma: allowlist secret - a public model checksum, not a credential
    model_sha256: "64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff"  # pragma: allowlist secret
    # Head pose is extracted and reported as head pose. It is NOT gaze: the
    # precedent's gaze findings rest on Tobii eye tracking, which these
    # recordings do not have. See docs/decisions/0013.
    head_pose: true

  openface:
    csv_dir: null                  # relative to $VC_WORK_ROOT
    confidence_column: "confidence"
    success_column: "success"

aggregate:
  # Applied to every action unit in both the speaking and listening windows.
  # The mean is what the precedent measured (docs/decisions/0013), so it is
  # what the confirmatory features are; the standard deviation adds how much
  # the expression moves within the window.
  stats: ["mean", "sd"]

  # These additionally get a 90th percentile. Action unit distributions are
  # heavily zero-inflated - most frames are neutral - so a mean answers "how
  # much expression overall" while a percentile answers "how strong it gets",
  # and the two can diverge sharply. Depth is spent on the three units
  # Miyamoto et al. 2025 found predictive of social performance, and nowhere
  # else.
  peak_action_units: ["au01", "au06", "au12"]

  # Head pose summarised as movement, not as position: only a standard
  # deviation is taken, because the mean records where the camera sat rather
  # than anything about the participant. Roll is omitted to stay inside the
  # feature budget; head tilt is the least socially loaded of the three.
  pose_measures: ["head_pitch", "head_yaw"]
  min_speaking_s: 30.0             # too little speech to summarise reliably
  min_listening_s: 30.0
  # A sanity ceiling only: it exists to catch a bug that generates hundreds of
  # columns, not to make the analysis defensible. That is done by the
  # confirmatory/exploratory split in model.tiers. See docs/decisions/0012.
  max_features: 80

handoff:
  bundle_dir: "handoff"            # under $VC_OUT_ROOT
  allow_dirty: false               # refuse to build from a dirty git tree

model:
  # This dataset is documented as 62 participants across 62 sessions with
  # unique IDs, so leave-one-participant-out is leave-one-session-out.
  # Supplying participant_map overrides that with an explicit mapping.
  grouping: "session"
  participant_map: null            # CSV: session_id,participant_id
  targets: ["K6", "SRS2"]

  # Feature sets compared against each other. Names refer to feature families;
  # "text" is only available when an external text-feature CSV is supplied.
  feature_sets:
    turns: ["turns"]
    prosody: ["prosody"]
    audio: ["turns", "prosody"]
    face: ["face_speaking", "face_listening"]
    all: ["turns", "prosody", "face_speaking", "face_listening"]
    text: ["text"]
    text_plus_audio: ["text", "turns", "prosody"]
    text_plus_all: ["text", "turns", "prosody", "face_speaking", "face_listening"]
  models: ["elastic_net", "random_forest"]
  n_permutations: 1000
  # The manuscript's text features: the baseline the new modalities are
  # compared against. Relative to $VC_WORK_ROOT, never committed.
  text_features:
    path: "nlp_features.csv"

    # How a row becomes a session.
    #
    #   identifier  the table carries a session ID column. Preferred, and the
    #               only mode that rests on nothing but the file itself.
    #   positional  the table has no identifier; rows are matched by position
    #               under the rule below, and every guard must pass.
    #
    # This file has no identifier column, so it is matched positionally under a
    # rule quoted from the code that wrote it. A table without an identifier and
    # without this block is refused rather than guessed at.
    identification: "positional"

    positional:
      rule: "numeric_ascending_session_id"

      # Quoted from the lab, 2026-09-24, describing the code that wrote the file.
      # This is the evidence for the rule, it is copied into the run manifest,
      # and it is what a reviewer reads when they ask how the tables were
      # aligned. Do not paraphrase it away.
      provenance: >-
        Rows were written by iterating transcript files with
        sorted(dir_path.glob(extension), key=lambda p: int(p.stem)), so the order
        is numeric ascending by session ID across the whole set
        (1, 3, 6 ... 62, 102 ... 261), not lexicographic. Confirmed by the lab on
        2026-09-24, quoting the original manuscript code.

      # The order is reproduced from the same files the lab iterated, rather
      # than from our own inventory, so a divergence between the two is detected
      # instead of silently averaged over.
      source_glob: "diarization/diarizations_original/*.srt"

      # The row count the ordering was confirmed against. A different count means
      # this is not the file the rule was confirmed for, and the stage stops.
      expected_rows: 62

  # The confirmatory/exploratory split. See docs/decisions/0012.
  #
  # The feature sets above, crossed with two targets and two model families,
  # are 32 cross-validated estimates on 62 observations. The best of 32 looks
  # good whether or not anything is there, so the headline result is a small
  # number of named tests and everything else is reported as exploratory.
  #
  # These features were chosen on prior literature, not on this data - and
  # could not have been chosen on this data, because the extraction half never
  # holds the questionnaire scores (docs/decisions/0001). The manifest records
  # the commit, so the ordering is verifiable rather than asserted.
  tiers:
    primary_features:
      turns:
        # Response timing: the most theory-central turn measure for social
        # communication. Reciprocity. And turn-taking rate.
        #
        # turns__overlap_ratio was the third of these until the diarization
        # output arrived. whisper-diarization partitions time - each moment
        # belongs to exactly one speaker - so overlap is exactly zero in all 62
        # sessions and the feature has no variance to contribute. It is kept in
        # the table as an honest zero recording that limitation, and the
        # confirmatory slot went to turn-taking rate, which is also
        # theory-central for social communication and does vary (33 to 149
        # segments per session). Changed before any questionnaire score was
        # seen; see docs/decisions/0012 and the CHANGELOG.
        - "turns__latency_median"
        - "turns__participant_speaking_ratio"
        - "turns__n_per_minute"
      prosody:
        # Reduced pitch variability is the most replicated acoustic correlate
        # of autistic-type speech, so it is the natural primary for SRS-2;
        # slowed speech is a long-standing marker of distress, for K6.
        - "prosody__f0_semitone_sd"
        - "prosody__speech_rate_proxy"
        - "prosody__intensity_sd_db"
      # The three AUs Miyamoto et al. 2025 found positively associated with
      # social performance: inner brow raiser, cheek raiser, lip corner
      # puller. Same three in both windows, so the speaking/listening
      # contrast is not confounded with a change of measure.
      # See docs/decisions/0013.
      face_speaking:
        - "face_speaking__au12_mean"
        - "face_speaking__au06_mean"
        - "face_speaking__au01_mean"
      face_listening:
        - "face_listening__au12_mean"
        - "face_listening__au06_mean"
        - "face_listening__au01_mean"

    # The confirmatory tests: for each target, the new modalities against the
    # text baseline. Four tests in total, not thirty-two.
    primary_comparisons:
      - name: "new_modalities_vs_text"
        against: ["all", "text"]
      - name: "audio_vs_text"
        against: ["audio", "text"]

    multiplicity_correction: "holm"

    # Leave-one-out stays primary, for comparability with the manuscript. It is
    # high-variance for comparing models, so a repeated k-fold estimate is
    # reported beside it; where they disagree, that is the finding.
    stability_cv: "repeated_kfold"
    stability_folds: 5
    stability_repeats: 20

runtime:
  workers: null                     # null: choose from CPU count
  log_level: "INFO"
  seed: 20260923
  # Sessions used by `make pilot`. UNCONFIRMED: replace with three real IDs.
  pilot_sessions: []
